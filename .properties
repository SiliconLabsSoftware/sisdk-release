id=com.silabs.sdk.stack.simplicity_sdk

version=2026.6.1

label=Simplicity SDK Suite
description=Simplicity SDK Suite for EFM32 and EFR32 microcontrollers and radios.

#names for the studio package manager
pkg_label=Simplicity Platform
pkg_description=Silicon Labs Gecko Platform

#Build Information
codeQuality=GA
buildNumber=0
# Look in these locations for extra properties
#   note that the single .properties input is a hack so that this will work while the stacks are updated
extendedProperties=micriumos/platform/micrium_os/micrium-krnx.properties zwave_sample_app/zwave_sample_app.slsdk rail_sdk/rail_sdk.slsdk bluetooth_le_app/bluetooth_le_app.slsdk bluetooth_mesh_app/bluetooth_mesh_app.slsdk openthread_app/openthread_app.slsdk wisun_ncp_app/wisun_ncp_app.slsdk wisun_config_generator/wisun_config_generator.slsdk zigbee/zigbee.slsdk wisun_ddp_app/wisun_ddp_app.slsdk wisun_rcp_app/wisun_rcp_app.slsdk zwave_cc_configurator/z-wave_cc_configurator.slsdk wisun_cli_app/wisun_cli_app.slsdk wisun_sdk_sample_app/wisun_sdk_sample_app.slsdk connect_sdk/connect_sdk.slsdk cpc_app/cpc_app.slsdk zigbee_app/zigbee_app.slsdk wisun_sdk/wisun_sdk.slsdk rail_sdk_sample_app/rail_sdk_sample_app.slsdk multiprotocol_app/multiprotocol_app.slsdk connect_sdk_sample_app/connect_sdk_sample_app.slsdk compute_app/compute_app.slsdk platform_security_sample_app/app/common/platform_security_sample_app.slsdk platform_sample_app/app/common/platform_sample_app.slsdk bootloader_sample_app/platform/bootloader/bootloader_sample_app.slsdk extension/amazon-sidewalk/sidewalk.slsdk extension/find-hub-sdk/find_hub_app.slsdk extension/test_agent_package/test_agent.slsdk extension/wiseconnect/wiseconnect.slsdk extension/aiml-extension/aiml.slsdk extension/wifi_sqa_internal/wifi_sqa_internal.slsdk extension/sqa_package/sqa.slsdk extension/bluetooth-location-services-sdk/bluetooth_location_services_app.slsdk extension/aliro-extension/aliro.slsdk extension/find-ecosystem-sdk/find_ecosystem_app.slsdk extension/find-my-sdk/find_my_app.slsdk extension/matter_extension/matter.slsdk

# Ensure protocols dont break board compatibility
prop.boardCompatibility=.*

# ESF
prop.requiredFeatureLevel=esf:2;app_framework:143
# ---- Location of apack.info ----
prop.file.adapterPacks=bluetooth_mesh_middleware/script/generator bluetooth_bgbuild ninja radio_config_generator wisun_config_generator zwave_cc_configurator
prop.supportModules=true
prop.useAdditionalLibraries=true

prop.file.hwconfFile=platform_core/platform/hwconf_data/hwconfig.hwdata

# (V)SE files
prop.file.seFirmwareFolders=se_firmware_xg23 se_firmware_xg26 se_firmware_xg21 se_firmware_xg28 se_firmware_xg24 se_firmware_x301 se_firmware_xg2d se_firmware_xg25 se_firmware_xg27 se_firmware_xg22 se_firmware_xg29

# Toolchains versions
prop.gccVersion=14.2.rel1
prop.llvmVersion=21.1.1
prop.iarVersion=9.70.4
